# PR 작성자를 Assignee로 자동 등록합니다.
#
# 리뷰어는 .github/CODEOWNERS가 자동으로 요청하지만, Assignee에는 GitHub
# 기본 기능이 없어 이 워크플로로 처리합니다.
name: PR 작성자 자동 할당

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    # Fork에서 온 PR은 Token이 읽기 전용이라 실패합니다. 같은 저장소의 PR만 처리합니다.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Assign the PR author
        # 값은 셸 명령에 직접 넣지 않고 환경변수로 전달합니다 (Script Injection 방지).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$PR_AUTHOR"
